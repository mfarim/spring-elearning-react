# Visitor country from Cloudflare's CF-IPCountry header, handed to the SPA as a geo_country cookie so it
# picks the UI language (Indonesian in Indonesia, English elsewhere) before the first render.
# - Only on page navigations: a Set-Cookie on static files or API responses would stop Cloudflare from
#   caching them. $request_uri is used because try_files rewrites $uri to /index.html.
# - Only a two-letter code passes, so nothing else from the header can reach the cookie.
# - Without Cloudflare (local runs) there is no header and no cookie; the SPA falls back to the time zone.
map $request_uri $geo_cookie_allowed {
    ~^/(api|ws|actuator)(/|\?|$)   0;
    ~^[^?]*\.[A-Za-z0-9]+(\?|$)    0;
    default                        1;
}

map "$geo_cookie_allowed:$http_cf_ipcountry" $geo_country_cookie {
    "~^1:(?<geo_cc>[A-Z]{2})$"     "geo_country=$geo_cc; Path=/; SameSite=Lax";
    default                        "";
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;
    server_tokens off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Legacy XSS auditor is deprecated and can introduce issues; disable it explicitly.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy: scripts, API calls and WebSockets only from this origin. Analytics hosts are
    # added through CSP_SCRIPT_SRC_EXTRA / CSP_CONNECT_SRC_EXTRA (substituted by the nginx image at start-up).
    # 'unsafe-inline' for styles only: React and some libraries set inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_SCRIPT_SRC_EXTRA}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ${CSP_CONNECT_SRC_EXTRA}; frame-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS belongs on the TLS-terminating host nginx / Cloudflare, not here (this server speaks plain HTTP).
    # Empty value (no country, or not a page navigation) = header not sent.
    add_header Set-Cookie $geo_country_cookie;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # BACKEND_UPSTREAM is host:port of the Spring Boot container: backend:8080 on Docker Compose (the
    # image's default), 127.0.0.1:8080 on Cloud Run where both containers share localhost.
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block public access to Spring Boot Actuator endpoints
    location /actuator/ {
        deny all;
        return 404;
    }

    location /ws {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
