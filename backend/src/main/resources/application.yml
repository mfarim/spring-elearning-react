server:
  port: 8080
  # Resolve the real client IP from X-Forwarded-For ONLY when the request comes from a trusted
  # internal proxy (Tomcat RemoteIpValve). Default trusted ranges: 10/8, 172.16/12, 192.168/16,
  # 169.254/16 and 127/8, i.e. the nginx container on the Docker network.
  forward-headers-strategy: native
  servlet:
    context-path: /

spring:
  application:
    name: elearning-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/elearning}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    # REQUIRED: no default on purpose. Generate with: openssl rand -base64 32
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  security:
    # true only for the public demo: skips forced password change and disables password changes
    demo-mode: ${APP_DEMO_MODE:false}
    # public self-registration (POST /api/v1/auth/register); accounts are normally created by admins
    registration-enabled: ${APP_REGISTRATION_ENABLED:false}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./storage/uploads}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.elearning: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
