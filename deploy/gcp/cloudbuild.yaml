# Builds both images on Cloud Build (x86_64, same as the e2 VM) and pushes them to Artifact Registry.
# Building on an Apple Silicon laptop would produce arm64 images that the VM cannot run without emulation.
#   gcloud builds submit --config deploy/gcp/cloudbuild.yaml --substitutions=_REGISTRY=...,_TAG=...
steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGISTRY}/backend:${_TAG}", "-t", "${_REGISTRY}/backend:latest", "backend"]
    waitFor: ["-"]
  - id: frontend
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGISTRY}/frontend:${_TAG}", "-t", "${_REGISTRY}/frontend:latest", "frontend"]
    waitFor: ["-"]

images:
  - "${_REGISTRY}/backend:${_TAG}"
  - "${_REGISTRY}/backend:latest"
  - "${_REGISTRY}/frontend:${_TAG}"
  - "${_REGISTRY}/frontend:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
