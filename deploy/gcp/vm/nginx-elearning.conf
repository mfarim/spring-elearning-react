# Host Nginx on the VM: same role as in Part 4 (TLS termination via Certbot, reverse proxy to the
# frontend container on 127.0.0.1:8088). __DOMAIN__ is replaced by deploy.sh.
# Certbot adds the 443 server block and the HTTP -> HTTPS redirect (certbot.sh).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    # Allow up to 50MB for learning materials (same limit as the frontend container and Spring)
    client_max_body_size 50M;

    access_log /var/log/nginx/elearning_access.log;
    error_log /var/log/nginx/elearning_error.log;

    # Frontend SPA and REST API
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (STOMP) for live exam monitoring
    location /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
